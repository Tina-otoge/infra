- hosts: nagato
  become: true
  gather_facts: false

  tasks:
    - name: Install Python
      raw: apk add --no-cache python3
      register: install_python
      changed_when: '" Installing " in install_python.stdout'
      tags: setup

- hosts: nagato
  become: true

  vars:
    kiosk_url: "http://asashio.lan:8123/kitchen-dashboard/0"
    kiosk_zoom_level: 0.9
    screen_timeout_seconds: 15
    screen_off_hour_min: 0
    screen_off_hour_max: 5
    sway_restart_timeout_seconds: 3600  # 1 hour

  tasks:
    - name: Remove packages
      package:
        name:
          - firefox
          - brightnessctl
          - brightnessctl-openrc
          - brightnessctl-udev
          - foot
          - foot-openrc
          - grim
          - swaylock
          - swaylock-openrc
          - swaylockd
          - i3status
          - wmenu
          - wl-clipboard
          - doas
          - iw
        state: absent
      tags: pkg

    - name: Install packages
      package:
        name:
          - curl
          - dbus-x11
          - firefox-esr
          - htop
          - mesa-dri-gallium
          - sudo
        state: present
      tags: pkg

    - name: Write usercfg.txt
      copy:
        dest: /boot/usercfg.txt
        owner: root
        group: root
        content: |
          # Needed to have an actual graphics driver, needed for Sway etc

          # Enable DRM VC4 V3D driver
          dtoverlay=vc4-kms-v3d
          max_framebuffers=2

          # Don't have the firmware create an initial video= setting in cmdline.txt.
          # Use the kernel's default instead.
          disable_fw_kms_setup=1

    - name: Configure network interfaces
      copy:
        dest: /etc/network/interfaces
        owner: root
        group: root
        mode: u=rw,g=r,o=r
        content: |
          auto lo
          iface lo inet loopback
          iface lo inet6 loopback

          auto eth0
          iface eth0 inet dhcp
          iface eth0 inet6 dhcp

          auto wlan0
          iface wlan0 inet dhcp

    - name: Allow wheel group passwordless sudo
      lineinfile:
        path: /etc/sudoers
        regexp: ^%wheel
        line: "%wheel ALL=(ALL:ALL) NOPASSWD: ALL"
        validate: /usr/sbin/visudo -cf %s

    - name: Lock root password
      user:
        name: root
        password_lock: true

    - name: Enable services in default runlevel
      service:
        name: "{{ item }}"
        enabled: true
      loop:
        - crond
        - dbus
        - ntpd
        - sshd

    - name: Enable services in boot runlevel
      command: rc-update add {{ item }} boot
      args:
        creates: /etc/runlevels/boot/{{ item }}
      loop:
        - networking
        - wpa_supplicant

    - name: Create kiosk user
      user:
        name: kiosk
        shell: /bin/ash
        create_home: true

    - name: Create autologin-kiosk script
      copy:
        dest: /usr/local/sbin/autologin-kiosk
        owner: root
        group: root
        mode: u=rwx,g=rx,o=rx
        content: |
          #!/bin/sh

          for status in /sys/class/drm/*/status; do
              [ -f "$status" ] || continue
              read -r state < "$status"
              [ "$state" = "connected" ] && exec /bin/login -f kiosk
          done
          exec /bin/login
      tags: login

    - name: Add autologin-kiosk to /etc/inittab for tty1
      lineinfile:
        path: /etc/inittab
        regexp: "^tty1::"
        line: tty1::respawn:/sbin/getty -n -l /usr/local/sbin/autologin-kiosk 38400 tty1
      tags: login

    - name: Set ~kiosk/.profile to autorun sway on tty1
      copy:
        dest: /home/kiosk/.profile
        owner: root
        group: root
        mode: u=rw,g=r,o=r
        content: |
          export PATH="$HOME/.local/bin:$PATH"

          if [ "$(tty)" = "/dev/tty1" ]; then
               exec dbus-run-session sway
          fi
      tags: login

    - name: Create ~kiosk/.config
      file:
        path: /home/kiosk/.config
        state: directory
        owner: kiosk
        group: kiosk
        mode: u=rwx,g=rx,o=rx
      tags: sway

    - name: Create ~kiosk/.config/sway
      file:
        state: directory
        path: /home/kiosk/.config/sway
        owner: root
        group: root
        mode: u=rwx,g=rx,o=rx
      tags: sway

    - name: Create ~kiosk/.local/bin
      file:
        path: "{{ item }}"
        state: directory
        owner: kiosk
        group: kiosk
        mode: u=rwx,g=rx,o=rx
      loop:
        - /home/kiosk/.local
        - /home/kiosk/.local/bin
        - /home/kiosk/.local/run
      tags: sway

    - name: Create Firefox profile directory
      file:
        path: /home/kiosk/.mozilla/firefox/kiosk
        state: directory
        owner: kiosk
        group: kiosk
        mode: u=rwx,g=rx,o=rx
      tags: sway

    - name: Create screen state script
      copy:
        dest: /home/kiosk/.local/bin/sway-set-screen-state
        owner: root
        group: root
        mode: u=rwx,g=rx,o=rx
        content: |
          #!/bin/sh

          export XDG_RUNTIME_DIR=/run/user/$(id -u kiosk)
          export WAYLAND_DISPLAY=wayland-1
          SWAYSOCK=$(find "$XDG_RUNTIME_DIR" -iname "sway-ipc.$(id -u kiosk).*.sock" 2>/dev/null | head -1)
          [ -n "$SWAYSOCK" ] || { echo "Sway IPC socket not found"; exit 1; }
          export SWAYSOCK

          case "$1" in
              on)
                  swaymsg output "*" bg "#ffffff" solid_color
                  swaymsg workspace 1
                  ;;
              off)
                  swaymsg output "*" bg "#000000" solid_color
                  swaymsg workspace blank
                  ;;
          esac
      tags: sway

    - name: Create screen idle script
      copy:
        dest: /home/kiosk/.local/bin/sway-turn-off-screen-time-aware
        owner: root
        group: root
        mode: u=rwx,g=rx,o=rx
        content: |
          #!/bin/sh

          hour=$(date +%H)
          if [ "$hour" -lt {{ screen_off_hour_max }} ] && [ "$hour" -ge {{ screen_off_hour_min }} ]; then
              sway-set-screen-state off
          fi
      tags: sway

    - name: Add cron to blank screen
      cron:
        user: kiosk
        name: sway-blank-screen
        minute: "0"
        hour: "{{ screen_off_hour_min }}"
        job: /home/kiosk/.local/bin/sway-set-screen-state off
      tags: sway

    - name: Add cron to wake screen
      cron:
        user: kiosk
        name: sway-wake-screen
        minute: "0"
        hour: "{{ screen_off_hour_max }}"
        job: /home/kiosk/.local/bin/sway-set-screen-state on
      tags: sway

    - name: Create browser kiosk wrapper script
      copy:
        dest: /home/kiosk/.local/bin/browser-kiosk
        owner: root
        group: root
        mode: u=rwx,g=rx,o=rx
        content: |
          #!/bin/sh

          PIDFILE=/home/kiosk/.local/run/firefox-esr.pid

          while true; do
              MOZ_USE_XINPUT2=1 firefox-esr --profile /home/kiosk/.mozilla/firefox/kiosk --kiosk "{{ kiosk_url }}" &
              echo $! > "$PIDFILE"
              wait $!
              rm -f "$PIDFILE"
              sleep 1
          done
      tags: sway

    - name: Create restart browser script
      copy:
        dest: /home/kiosk/.local/bin/restart-browser
        owner: root
        group: root
        mode: u=rwx,g=rx,o=rx
        content: |
          #!/bin/sh

          PIDFILE=/home/kiosk/.local/run/firefox-esr.pid
          if [ -f "$PIDFILE" ]; then
              kill "$(cat "$PIDFILE")"
          else
              pkill -x /usr/lib/firefox-esr/firefox-esr
          fi
      tags: sway

    - name: Set Firefox zoom level for kiosk URL
      script:
        cmd: >-
          files/set-firefox-zoom.py
          --db /home/kiosk/.mozilla/firefox/kiosk/content-prefs.sqlite
          --url "{{ kiosk_url }}"
          --zoom {{ kiosk_zoom_level }}
      register: zoom_result
      changed_when: "'changed' in zoom_result.stdout"
      tags: firefox

    - name: Create sway config
      copy:
        dest: /home/kiosk/.config/sway/config
        owner: root
        group: root
        mode: u=rw,g=r,o=r
        content: |
          output * bg #ffffff solid_color
          seat * xcursor_theme default 0
          assign [app_id="^firefox"] workspace 1
          exec browser-kiosk
          exec swayidle -w \
              timeout {{ screen_timeout_seconds }} sway-turn-off-screen-time-aware \
              timeout {{ sway_restart_timeout_seconds }} restart-browser \
              resume 'sway-set-screen-state on'
      tags: sway
