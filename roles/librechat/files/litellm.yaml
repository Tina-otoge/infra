model_list:
  - model_name: bedrock-eu-minimax-2.5
    litellm_params:
      model: bedrock/minimax.minimax-m2.5
      aws_region_name: eu-west-2
  - model_name: bedrock-eu-qwen-coder-next
    litellm_params:
      model: bedrock/qwen.qwen3-coder-next
      aws_region_name: eu-west-2
  - model_name: bedrock-eu-kimi-2.5
    litellm_params:
      model: bedrock/moonshotai.kimi-k2.5
      aws_region_name: eu-west-2

  - model_name: coding-cheap
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: coding-smart
    litellm_params:
      model: zai/glm-5.2
      api_key: os.environ/ZAI_API_KEY
  - model_name: coding-max
    litellm_params:
      model: moonshot/kimi-k3
      api_key: os.environ/MOONSHOT_API_KEY

litellm_settings:
  # Drop OpenAI params the target model doesn't support instead of erroring
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
