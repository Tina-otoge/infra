model_list:
  - model_name: Minimax M2.5 (AWS)
    litellm_params:
      model: bedrock/minimax.minimax-m2.5
      aws_region_name: eu-west-2
  - model_name: Qwen3 Coder Next (AWS)
    litellm_params:
      model: bedrock/qwen.qwen3-coder-next
      aws_region_name: eu-west-2
  - model_name: Kimi K2.5 (AWS)
    litellm_params:
      model: bedrock/moonshotai.kimi-k2.5
      aws_region_name: eu-west-2

  - model_name: Cheap (DeepSeek V4 Flash)
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: Smart (GLM 5.2)
    litellm_params:
      model: zai/glm-5.2
      api_key: os.environ/ZAI_API_KEY
  - model_name: Max (Kimi K3)
    litellm_params:
      model: moonshot/kimi-k3
      api_key: os.environ/MOONSHOT_API_KEY

litellm_settings:
  # Drop OpenAI params the target model doesn't support instead of erroring
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
