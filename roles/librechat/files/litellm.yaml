      api_key: os.environ/MOONSHOT_API_KEY

litellm_settings:
  # Drop OpenAI params the target model doesn't support instead of erroring
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: "postgresql://litellm:litellm@systemd-litellm-db:5432/litellm"
  store_model_in_db: true
