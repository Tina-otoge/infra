version: 1.3.13
cache: true
endpoints:
  bedrock:
    availableRegions:
      - eu-west-2
    models:
      - minimax.minimax-m2.5
      - qwen.qwen3-coder-next
      - moonshotai.kimi-k2.5
  custom:
    - name: LiteLLM
      apiKey: ${LITELLM_MASTER_KEY}
      baseURL: http://litellm:4000/v1
      models:
        default:
          - bedrock-eu-minimax-2.5
          - bedrock-eu-qwen-coder-next
          - bedrock-eu-kimi-2.5
          - coding-cheap
          - coding-smart
          - coding-max
        fetch: false
      titleConvo: true
      titleModel: coding-cheap
  allowedAddresses:
    - litellm:4000
mcpServers:
  playwright:
    type: sse
    url: http://playwright-mcp:8931/sse
  searxng:
    type: streamable-http
    url: http://searxng-mcp:3000/mcp
mcpSettings:
  allowedAddresses:
    - playwright-mcp:8931
    - searxng-mcp:3000
