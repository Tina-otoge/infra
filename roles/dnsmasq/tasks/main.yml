- name: Ensure dnsmasq is installed
  package:
    name: dnsmasq
    state: present

- name: Disable Firefox doh
  copy:
    content: address=/use-application-dns.net/
    dest: /etc/dnsmasq.d/disable-firefox-doh.conf
  notify: dnsmasq restart

- name: Disable listening on interface by name
  lineinfile:
    line: "#interface="
    dest: /etc/dnsmasq.conf
    regexp: "^interface="
  notify: dnsmasq restart

- name: Listen on all interfaces
  lineinfile:
    line: "#listen-address="
    dest: /etc/dnsmasq.conf
    regexp: "^listen-address="
  notify: dnsmasq restart

- name: Answer queries from any subnet/interface
  lineinfile:
    line: "#local-service"
    dest: /etc/dnsmasq.conf
    regexp: "^#?local-service"
  notify: dnsmasq restart

- name: Resolve names with multiple addresses by using the requester's subnet
  lineinfile:
    line: localise-queries
    dest: /etc/dnsmasq.conf
    regexp: "^#?localise-queries"
  notify: dnsmasq restart

- name: Add DNS servers
  lineinfile:
    line: "server={{ item }}"
    dest: /etc/dnsmasq.conf
  loop: "{{ dns_servers }}"
  notify: dnsmasq restart

- name: Add local suffixes
  lineinfile:
    line: "local=/{{ item }}/"
    dest: /etc/dnsmasq.conf
  loop: "{{ dns_local_suffixes }}"
  notify: dnsmasq restart

- name: Disable resolv.conf
  lineinfile:
    line: no-resolv
    dest: /etc/dnsmasq.conf
    regexp: ".*no-resolv$"
  notify: dnsmasq restart
