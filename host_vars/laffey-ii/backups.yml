backups_job_machine_dumps:
  litellm.sql: podman exec systemd-litellm-db pg_dumpall --clean --if-exists --username=litellm
  librechat.mongo.archive: podman exec systemd-librechat-mongo mongodump --archive --quiet
  etcd.snapshot.db: >-
    ETCDCTL_USER="root:$(grep '^root:' {{ ansible_facts.user_dir }}/.config/etcd/users.passwd | cut -d: -f2-)"
    podman exec -e ETCDCTL_USER systemd-etcd etcdctl snapshot save /etcd-data/backup-snapshot.db >&2
    && cat {{ ansible_facts.user_dir }}/.local/share/etcd/backup-snapshot.db
    && rm {{ ansible_facts.user_dir }}/.local/share/etcd/backup-snapshot.db

backups_exclude_extra:
  - "{{ ansible_facts.user_dir }}/.local/share/grafana/plugins*"
  - "{{ ansible_facts.user_dir }}/.local/share/librechat/mongo*"

backups_jobs_extra:
  mc-overdrive:
    paths:
      - "{{ ansible_facts.user_dir }}/Games/Minecraft/overdrive/"
    repository: "{{ backups_repository_base }}/mc-overdrive"
    archive: "{{ backups_archive }}"
    calendar: monthly
    prepare_script: |
      curl -X POST -H 'Content-type: application/json' -d '{"content": "co purge t:30d"}' $MC_WEBHOOK_URL
      curl -X POST -H 'Content-type: application/json' -d '{"content": "say Backup procedure started. Server will restart in 10 minutes."}' $MC_WEBHOOK_URL
      logmsg "Waiting 10 minutes to ensure CoreProtect finishes purging data and to let time for players to disconnect..." >/dev/null
      sleep 10m
      logmsg "Done waiting. Stopping Minecraft service."
      systemctl -M tina@ --user stop mc
    cleanup_script: |
      systemctl -M tina@ --user start mc


