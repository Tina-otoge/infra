quadlets:
  ownfoil:
    image: a1ex4/ownfoil
    ports:
      - "{{ loopback_ip }}:{{ ports.foil }}:8465"
    volumes:
      - "{{ ansible_facts.user_dir }}/.config/ownfoil:/app/config"
      - "{{ ansible_facts.user_dir }}/.local/share/ownfoil:/app/data"
      - "{{ ansible_facts.user_dir }}/Games/Console/Switch:/games"

  sonarr:
    image: lscr.io/linuxserver/sonarr
    tag: latest
    volumes:
      - "{{ ansible_facts.user_dir }}/.config/sonarr:/config"
      - "/mnt/sakura:/mnt/sakura"
    ports:
      - "{{ loopback_ip }}:8989:8989"
    env: "{{ linuxserver_env }}"
    network: six.network
  # lidarr:
  #   image: lscr.io/linuxserver/lidarr
  #   tag: latest
  #   volumes:
  #     - "{{ ansible_facts.user_dir }}/.config/lidarr:/config"
  #     - "/mnt/sakura:/mnt/sakura"
  #   ports:
  #     - "{{ loopback_ip }}:8686:8686"
  #   env: "{{ linuxserver_env }}"
  #   network: six.network
  qbit:
    image: lscr.io/linuxserver/qbittorrent
    tag: latest
    volumes:
      - "{{ ansible_facts.user_dir }}/.config/qbittorrent:/config"
      - /mnt/sakura:/mnt/sakura
    ports:
      - "{{ loopback_ip }}:{{ ports.qbittorrent_webui }}:8080"
    env: "{{ linuxserver_env }}"
    network: six.network
    exec_pre: |
      rm -rfv {{ ansible_facts.user_dir }}/.config/qbittorrent/qBittorrent/lockfile;
      rm -rfv {{ ansible_facts.user_dir }}/.config/qbittorrent/qBittorrent/ipc-socket;
  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    tag: latest
    volumes:
      - "{{ ansible_facts.user_dir }}/.config/prowlarr:/config"
    ports:
      - "{{ loopback_ip }}:{{ ports.prowlarr }}:{{ ports.prowlarr }}"
    env: "{{ linuxserver_env }}"
    network: six.network
  lms:
    image: epoupon/lms
    tag: latest
    user: root
    ports:
      - "{{ loopback_ip }}:5082:5082"
    volumes:
      - "{{ ansible_facts.user_dir }}/.config/lms:/config"
      - "{{ ansible_facts.user_dir }}/.local/share/lms:/var/lms:rw"
      - /mnt/sakura/public/Works/Music:/music:ro
    exec: /config/lms.conf
  jellyfin:
    image: jellyfin/jellyfin
    tag: "{{ versions.jellyfin }}"
    ports:
      - "{{ loopback_ip }}:{{ ports.jellyfin }}:{{ ports.jellyfin }}"
    volumes:
      - /mnt/sakura/public:/mnt/sakura/public:ro
      - "{{ ansible_facts.user_dir }}/.config/jellyfin:/config"
      - "{{ ansible_facts.user_dir }}/.cache/jellyfin:/cache"
    exec_pre: |
      plugins={{ ansible_facts.user_dir }}/.config/jellyfin/plugins;
      if [ ! -d "$plugins" ]; then exit 0; fi;
      dirs=$(find "$plugins" -maxdepth 1 -type d -name 'Editor*Choice_*' | sort -V);
      n=$(echo "$dirs" | grep -c .);
      if [ "$n" -le 1 ]; then exit 0; fi;
      echo "$n versions of Editor's Choice plugin data detected, this is known to cause issues, deleting older versions...";
      echo "$dirs" | head -n -1 | xargs -d '\n' -r rm -rfv;
    devices:
      - /dev/dri/renderD128
    groupadds:
      - 105 # render
    networks:
      - six.network
  embyserver:
    image: emby/embyserver
    tag: latest
    ports:
      - "{{ loopback_ip }}:{{ ports.embyserver }}:8096"
    volumes:
      - "{{ ansible_facts.user_dir }}/.config/embyserver:/config"
      - /mnt/sakura/public:/mnt/sakura/public:ro
    devices:
      - /dev/dri/renderD128
    groupadds:
      - 105 # render
    networks:
      - six.network
  kavita:
    image: lscr.io/linuxserver/kavita
    tag: latest
    ports:
      - "{{ loopback_ip }}:{{ ports.kavita }}:5000"
    volumes:
      - "{{ ansible_facts.user_dir }}/.config/kavita:/config"
      - "{{ ansible_facts.user_dir }}/.local/share/kavita:/data"
      - /mnt/sakura/public/Works/Books:/mnt/sakura/public/Works/Books:ro
    env: "{{ linuxserver_env }}"
  komga:
    image: gotson/komga
    tag: latest
    ports:
      - "{{ loopback_ip }}:{{ ports.komga }}:25600"
    volumes:
      - "{{ ansible_facts.user_dir }}/.config/komga:/config"
      - "{{ ansible_facts.user_dir }}/.local/share/komga:/data"
      - /mnt/sakura/public/Works/Books:/mnt/sakura/public/Works/Books:ro
    env: "{{ linuxserver_env }}"
  rtmp:
    image: tiangolo/nginx-rtmp
    tag: latest
    ports:
      - "{{ local_ip }}:1935:1935"
    volumes:
      - "{{ ansible_facts.user_dir }}/.config/nginx-rtmp:/etc/nginx/"
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant
    tag: stable
    scope: system
    ports:
      - 0.0.0.0:8123:8123
    volumes:
      - /etc/homeassistant:/config
      - /var/run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env:
      TZ: Europe/Paris
    network: host
    podman: --privileged
  headscale:
    image: docker.io/headscale/headscale
    tag: unstable
    tmpfs:
      - /var/run/headscale
    volumes:
      - "{{ ansible_facts.user_dir }}/.config/headscale:/etc/headscale:ro"
      - "{{ ansible_facts.user_dir }}/.local/share/headscale:/var/lib/headscale"
    exec: serve
    ports:
      - "{{ loopback_ip }}:{{ ports.headscale_http }}:8080"
      - "{{ loopback_ip }}:{{ ports.headscale_metrics }}:9090"
  romm_db:
    image: docker.io/library/mariadb
    tag: latest
    network: romm.network
    network_alias: romm-db
    volumes:
      - "{{ ansible_facts.user_dir }}/.local/share/romm/mysql:/var/lib/mysql"
    env:
      MARIADB_ROOT_PASSWORD: romm
      MARIADB_DATABASE: romm
      MARIADB_USER: romm-user
      MARIADB_PASSWORD: romm
  romm:
    image: docker.io/rommapp/romm
    tag: latest
    depend: romm-db.service
    network: romm.network
    network_alias: romm
    volumes:
      - "{{ ansible_facts.user_dir }}/.local/share/romm/resources:/romm/resources"
      - "{{ ansible_facts.user_dir }}/.local/share/romm/redis-data:/redis-data"
      - "{{ ansible_facts.user_dir }}/.local/share/romm/library:/romm/library"
      - "{{ ansible_facts.user_dir }}/.local/share/romm/assets:/romm/assets"
      - /mnt/sakura/public/Works/Games/Console:/mnt/sakura/public/Works/Games/Console:ro
      - "{{ ansible_facts.user_dir }}/Games/Console:{{ ansible_facts.user_dir }}/Games/Console:ro"
      - "{{ ansible_facts.user_dir }}/.config/romm:/romm/config"
    ports:
      - "{{ loopback_ip }}:{{ ports.romm }}:8080"
    env_file: "{{ ansible_facts.user_dir }}/.local/share/romm/romm.env"
    env:
      DB_HOST: romm-db
      DB_NAME: romm
      DB_USER: romm-user
      DB_PASSWD: romm
      HASHEOUS_API_ENABLED: "true"
  immich_db:
    image: ghcr.io/immich-app/postgres
    tag: 14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    network: immich.network
    network_alias: immich-db
    volumes:
      - "{{ ansible_facts.user_dir }}/.local/share/immich/postgres:/var/lib/postgresql/data"
    shm_size: 128m
    env:
      POSTGRES_PASSWORD: immich
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
  immich_redis:
    image: docker.io/valkey/valkey
    tag: 9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    network: immich.network
    network_alias: immich-redis
    podman: >-
      --health-cmd='redis-cli ping | grep -q PONG || exit 1'
  immich_machine_learning:
    image: ghcr.io/immich-app/immich-machine-learning
    tag: v3-openvino
    network: immich.network
    network_alias: immich-machine-learning
    env:
      MACHINE_LEARNING_HTTP_KEEPALIVE_TIMEOUT_S: 30
    volumes:
      - "{{ ansible_facts.user_dir }}/.local/share/immich/model-cache:/cache"
    devices:
      - /dev/dri:/dev/dri
    groupadds:
      - 105
  immich:
    image: ghcr.io/immich-app/immich-server
    tag: v3
    depend: immich-db.service immich-redis.service immich-machine-learning.service
    network: immich.network
    network_alias: immich-server
    volumes:
      - "{{ ansible_facts.user_dir }}/Backups/Camera/Immich:/data"
      - "{{ ansible_facts.user_dir }}/.local/share/immich/backups:/data/backups"
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "{{ loopback_ip }}:{{ ports.immich }}:2283"
    devices:
      - /dev/dri:/dev/dri
    groupadds:
      - 105
    env:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: immich
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
