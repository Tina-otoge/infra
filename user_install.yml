- hosts: all
  become: true
  become_user: tina

  tasks:
    - include_tasks:
        file: "tasks/user/{{ task }}.yml"
        apply:
          tags:
            - user
            - "{{ task }}"
      loop: "{{ user_tasks_base + user_tasks }}"
      loop_control:
        loop_var: task
      tags:
        - always
    - include_role:
        name: "{{ role }}"
        apply:
          tags: "{{ role }}"
      tags: always
      loop:
        - containers
      loop_control:
        loop_var: role

    - include_role:
        name: "{{ role }}"
        apply:
          tags: "{{ role }}"
      tags: always
      loop:
        - librechat
        - loki
      loop_control:
        loop_var: role
      when: inventory_hostname == 'laffey-ii'
    - include_role:
        name: etcd
        apply:
          tags: etcd
      tags: always
      when: "'etcd' in quadlets"
    - include_role:
        name: versitygw
        apply:
          tags: versitygw
      tags: always
      when: "'versitygw' in quadlets"

  handlers:
    - name: systemd reload
      systemd:
        daemon_reload: true
    - name: systemd user reload
      systemd:
        daemon_reload: true
        scope: user
    - name: prometheus restart
      systemd:
        name: prometheus
        state: restarted
        scope: user
