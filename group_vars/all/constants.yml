loopback_ip: 127.0.0.1
podman_host_loopback_ip: 10.0.2.2
podman_host_address: host.containers.internal

monitoring_domain: dijiang.tina.moe

python_setup: |-
  if [ ! -x .venv/bin/python ] || ! .venv/bin/python -m pip --version >/dev/null 2>&1; then python3 -m venv --clear .venv; fi
  .venv/bin/python -m pip install -r requirements.txt
  source .venv/bin/activate

bash_setup: |-
  export PATH={{ ansible_facts.user_dir }}/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin

compose_setup: |-
  {{ bash_setup }}
  podman-compose stop
  podman-compose down --remove-orphans
  podman-compose build --pull
  podman-compose up

sssimp_setup: |-
  {{ bash_setup }}
  if [ ! -x .venv/bin/python ] || ! .venv/bin/python -m pip --version >/dev/null 2>&1; then python3 -m venv --clear .venv; fi
  .venv/bin/python -m pip install sssimp
  ./.venv/bin/sssimp

linuxserver_env:
  # Since we run containers as the current user, we need to run as root inside
  # the container, as root in container = current user outside the container
  # with Podman
  PUID: 0
  PGID: 0
  UMASK: 002

# Shared between install_aws_bedrock_cost_watcher.yml (creates it) and
# reenable_aws_bedrock.yml (detaches it): the Deny-bedrock:* kill-switch policy.
bedrock_kill_switch_policy_name: BedrockCostWatcherKillSwitch

