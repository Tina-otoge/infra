- hosts: all
  become: true

  tasks:
    - name: Configure weekly disk housekeeping
      tags: housekeeping
      block:
        - name: Install disk housekeeping reporting dependencies
          package:
            name:
              - curl
              - jq
            state: present

        - name: Schedule weekly disk housekeeping
          include_role:
            name: common
            tasks_from: create_service
            apply:
              tags: housekeeping
          vars:
            service_name: disk-housekeeping
            service_scope: system
            service_user: root
            service_schedule: weekly
            service_random_delay: 1h
            service_state: started
            service_type: oneshot
            service_script: "{{ lookup('template', 'templates/disk_housekeeping.bash.j2') }}"

    - include_role:
        name: common
        tasks_from: delete_service
        apply:
          tags:
            - clean
      vars:
        service_name: "{{ item.name }}"
        service_timer: "{{ item.timer | default(False) }}"
      loop:
        - name: backup_machine
          timer: true
        - name: smart_check
        - name: upgrade-and-restart
          timer: true
      loop_control:
        label: "{{ item.name }}"
      tags: always
    - include_tasks:
        file: "tasks/server/{{ task }}.yml"
        apply:
          tags:
            - server
            - "{{ task }}"
      loop: "{{ server_tasks_base + server_tasks }}"
      loop_control:
        loop_var: task
        label: "{{ task }}"
      tags: always
      when: task not in server_tasks_disabled
    - include_role:
        name: "{{ role }}"
        apply:
          tags:
            - "{{ role }}"
      tags: always
      loop: "{{ server_roles }}"
      loop_control:
        loop_var: role
        label: "{{ role }}"

    # - name: Install Prometheus Node Exporter
    #   include_role:
    #     name: prometheus.prometheus.node_exporter
    #     apply:
    #       tags:
    #         - server
    #         - node_exporter
    #   vars:
    #     node_exporter_web_listen_address: "localhost:9100"
    #   tags:
    #     - always

  handlers:
    - name: cockpit reload
      systemd:
        name: cockpit.socket
        state: restarted
    - name: wsdd restart
      systemd:
        name: wsdd
        state: restarted
    - name: promtail restart
      systemd:
        name: promtail
        state: restarted
    - name: tunnels restart
      systemd:
        name: tunnels
        state: restarted
    - name: fail2ban restart
      systemd:
        name: fail2ban
        state: restarted
    - name: systemd reload
      systemd:
        daemon_reload: true

- hosts: asashio
  become: true
  tags:
    - dedupe
    - defrag
  tasks:
    - name: Schedule weekly Sakura deduplication
      include_role:
        name: common
        tasks_from: create_service
      vars:
        service_name: sakura-defrag
        service_scope: system
        service_user: root
        service_schedule: Mon *-*-* 06:00:00 Europe/Paris
        service_state: started
        service_type: oneshot
        service_dependency: mnt-sakura.mount
        service_script: "{{ lookup('file', 'files/sakura-maintenance.sh') }}"
