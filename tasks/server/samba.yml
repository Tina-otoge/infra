- name: Create share user
  user:
    name: share
    password: "*"


- name: Enable registry for samba
  ini_file:
    path: /etc/samba/smb.conf
    mode: u=rw,g=r,o=r
    section: "{{ item.section | default('global') }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  loop:
    - option: include
      value: registry
    - option: workgroup
      value: "{{ ansible_hostname | upper }}"
    - option: map to guest
      value: Bad User
    - option: force user
      value: share
    - section: homes
      option: available
      value: false

- name: Set Windows Discovery workgroup to address
  copy:
    dest: /etc/default/wsdd
    mode: u=rw,g=r,o=r
    content: |
      WSDD_PARAMS="-n {{ http_domain }}"
  notify: wsdd restart
