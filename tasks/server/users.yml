- name: Create directories in skeleton directory
  file:
    path: "/etc/skel/{{ item }}"
    state: directory
    mode: "u=rwX,g=rX,o=rX"
  loop: "{{ skel }}"

- set_fact:
    _users_all: "{{ users + users_admins }}"

- set_fact:
    _admin_group: wheel

  when: ansible_os_family == 'RedHat'
- set_fact:
    _admin_group: sudo
  when: ansible_os_family == 'Debian'

- name: Create users
  user:
    name: "{{ item }}"
    groups: "{% if item in users_admins %}{{ _admin_group }}{% endif %}"
    append: true
    generate_ssh_key: true
    shell: "{{ user_shell | default(omit) }}"
  loop: "{{ _users_all }}"

- name: Check the lingering state of users
  stat:
    path: "/var/lib/systemd/linger/{{ item }}"
  register: user_linger_status
  loop: "{{ _users_all }}"

- name: Enable lingering for users
  command: "loginctl enable-linger {{ item }}"
  loop: |
    {{
      user_linger_status.results
      | rejectattr('stat.exists')
      | map(attribute='item')
      | list
    }}
